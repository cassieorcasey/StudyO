name: Uji
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Pastikan index.html sudah dibangun dari src/
        run: |
          python3 build.py
          git diff --exit-code index.html || (echo "index.html tidak sama dengan hasil build src/. Jalankan: python3 build.py" && exit 1)
      - run: node tests/run.js
